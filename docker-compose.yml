name: mindory

x-mindory-env: &mindory-env
  MINDORY_LOG_LEVEL: ${MINDORY_LOG_LEVEL:-info}
  MINDORY_API_HOST: ${MINDORY_API_HOST:-0.0.0.0}
  MINDORY_API_PORT: ${MINDORY_API_PORT:-3000}
  MINDORY_PUBLIC_URL: ${MINDORY_PUBLIC_URL:-http://localhost:3000}
  MINDORY_API_RATE_LIMIT_ENABLED: ${MINDORY_API_RATE_LIMIT_ENABLED:-true}
  MINDORY_API_RATE_LIMIT_WINDOW_MS: ${MINDORY_API_RATE_LIMIT_WINDOW_MS:-60000}
  MINDORY_API_RATE_LIMIT_MAX: ${MINDORY_API_RATE_LIMIT_MAX:-600}
  MINDORY_DATABASE_URL: ${MINDORY_DATABASE_URL:-postgresql://mindory:mindory@postgres:5432/mindory}
  MINDORY_REDIS_URL: ${MINDORY_REDIS_URL:-redis://redis:6379}
  MINDORY_QUEUE_PREFIX: ${MINDORY_QUEUE_PREFIX:-mindory:queue}
  MINDORY_CACHE_PREFIX: ${MINDORY_CACHE_PREFIX:-mindory:cache}
  MINDORY_STORAGE_PROVIDER: ${MINDORY_STORAGE_PROVIDER:-local-fs}
  MINDORY_STORAGE_LOCAL_PATH: ${MINDORY_STORAGE_LOCAL_PATH:-/data/mindory/objects}
  MINDORY_S3_ENDPOINT: ${MINDORY_S3_ENDPOINT:-http://minio:9000}
  MINDORY_S3_REGION: ${MINDORY_S3_REGION:-us-east-1}
  MINDORY_S3_BUCKET: ${MINDORY_S3_BUCKET:-mindory}
  MINDORY_S3_ACCESS_KEY_ID: ${MINDORY_S3_ACCESS_KEY_ID:-mindory}
  MINDORY_S3_SECRET_ACCESS_KEY: ${MINDORY_S3_SECRET_ACCESS_KEY:-mindory-secret}
  MINDORY_S3_FORCE_PATH_STYLE: ${MINDORY_S3_FORCE_PATH_STYLE:-true}
  MINDORY_VECTOR_PROVIDER: ${MINDORY_VECTOR_PROVIDER:-pgvector}
  MINDORY_QDRANT_URL: ${MINDORY_QDRANT_URL:-http://qdrant:6333}
  MINDORY_QDRANT_COLLECTION_PREFIX: ${MINDORY_QDRANT_COLLECTION_PREFIX:-mindory}
  MINDORY_AV_ENABLED: ${MINDORY_AV_ENABLED:-true}
  MINDORY_AV_PROVIDER: ${MINDORY_AV_PROVIDER:-clamav}
  MINDORY_AV_MODE: ${MINDORY_AV_MODE:-async_quarantine}
  MINDORY_AV_REQUIRED_BEFORE_READ: ${MINDORY_AV_REQUIRED_BEFORE_READ:-true}
  MINDORY_AV_REQUIRED_BEFORE_EXTRACTION: ${MINDORY_AV_REQUIRED_BEFORE_EXTRACTION:-true}
  MINDORY_AV_REQUIRED_BEFORE_INDEXING: ${MINDORY_AV_REQUIRED_BEFORE_INDEXING:-true}
  MINDORY_AV_ON_SCAN_FAILURE: ${MINDORY_AV_ON_SCAN_FAILURE:-block}
  MINDORY_AV_ON_INFECTED: ${MINDORY_AV_ON_INFECTED:-quarantine}
  MINDORY_CLAMAV_HOST: ${MINDORY_CLAMAV_HOST:-clamav}
  MINDORY_CLAMAV_PORT: ${MINDORY_CLAMAV_PORT:-3310}
  MINDORY_WORKER_TYPE: ${MINDORY_WORKER_TYPE:-all}
  MINDORY_WORKER_CONCURRENCY: ${MINDORY_WORKER_CONCURRENCY:-2}
  MINDORY_LLM_PROVIDER: ${MINDORY_LLM_PROVIDER:-disabled}
  MINDORY_LLM_EMBEDDING_MODEL: ${MINDORY_LLM_EMBEDDING_MODEL:-}
  MINDORY_LLM_CHAT_MODEL: ${MINDORY_LLM_CHAT_MODEL:-}
  MINDORY_LLM_EMBEDDING_DIMENSIONS: ${MINDORY_LLM_EMBEDDING_DIMENSIONS:-}
  MINDORY_LLM_OPENAI_COMPATIBLE_BASE_URL: ${MINDORY_LLM_OPENAI_COMPATIBLE_BASE_URL:-}
  MINDORY_LLM_OPENAI_COMPATIBLE_AUTH_MODE: ${MINDORY_LLM_OPENAI_COMPATIBLE_AUTH_MODE:-none}
  MINDORY_LLM_OPENAI_COMPATIBLE_API_KEY: ${MINDORY_LLM_OPENAI_COMPATIBLE_API_KEY:-}
  MINDORY_LLM_OPENAI_OAUTH_ACCESS_TOKEN: ${MINDORY_LLM_OPENAI_OAUTH_ACCESS_TOKEN:-}
  MINDORY_LLM_OLLAMA_BASE_URL: ${MINDORY_LLM_OLLAMA_BASE_URL:-http://ollama:11434}
  MINDORY_MCP_ENABLED: ${MINDORY_MCP_ENABLED:-true}
  MINDORY_MCP_TRANSPORT: ${MINDORY_MCP_TRANSPORT:-stdio}
  MINDORY_MCP_API_URL: ${MINDORY_MCP_API_URL:-http://api:3000}
  MINDORY_MCP_API_TOKEN: ${MINDORY_MCP_API_TOKEN:-}
  MINDORY_CLI_API_URL: ${MINDORY_CLI_API_URL:-http://api:3000}
  MINDORY_CLI_API_TOKEN: ${MINDORY_CLI_API_TOKEN:-}
  MINDORY_HERMES_ADAPTER_ENABLED: ${MINDORY_HERMES_ADAPTER_ENABLED:-false}
  MINDORY_HERMES_API_URL: ${MINDORY_HERMES_API_URL:-http://api:3000}
  MINDORY_HERMES_API_TOKEN: ${MINDORY_HERMES_API_TOKEN:-}
  MINDORY_HERMES_DEFAULT_PROJECT: ${MINDORY_HERMES_DEFAULT_PROJECT:-default}
  MINDORY_HERMES_DEFAULT_USER_PEER: ${MINDORY_HERMES_DEFAULT_USER_PEER:-default-user}
  MINDORY_HERMES_DEFAULT_AGENT_PEER: ${MINDORY_HERMES_DEFAULT_AGENT_PEER:-hermes}
  MINDORY_HERMES_CONTEXT_TOKEN_BUDGET: ${MINDORY_HERMES_CONTEXT_TOKEN_BUDGET:-3000}

x-mindory-app: &mindory-app
  build:
    context: .
    dockerfile: Dockerfile
  working_dir: /app
  init: true
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: mindory
      POSTGRES_USER: mindory
      POSTGRES_PASSWORD: mindory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindory -d mindory"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

  migrate:
    <<: *mindory-app
    restart: "no"
    command: ["pnpm", "db:migrate"]
    environment:
      <<: *mindory-env
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *mindory-app
    command: ["node", "apps/api/dist/server.js"]
    environment:
      <<: *mindory-env
      NODE_ENV: production
    ports:
      - "${MINDORY_API_PORT:-3000}:${MINDORY_API_PORT:-3000}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const port=process.env.MINDORY_API_PORT||3000; fetch('http://127.0.0.1:'+port+'/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1));"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - objects-data:/data/mindory/objects

  mcp:
    <<: *mindory-app
    command: ["node", "apps/mcp/dist/stdio.js"]
    stdin_open: true
    environment:
      <<: *mindory-env
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *mindory-app
    command: ["node", "apps/worker/dist/server.js"]
    environment:
      <<: *mindory-env
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - objects-data:/data/mindory/objects

  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINDORY_S3_ACCESS_KEY_ID:-mindory}
      MINIO_ROOT_PASSWORD: ${MINDORY_S3_SECRET_ACCESS_KEY:-mindory-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  clamav:
    image: clamav/clamav:stable
    platform: ${MINDORY_CLAMAV_PLATFORM:-linux/amd64}
    profiles: ["clamav"]
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["qdrant"]
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  docling:
    image: node:24-alpine
    profiles: ["docling"]
    restart: unless-stopped
    working_dir: /workspace
    command: ["node", "scripts/docker-placeholder-service.mjs", "docling"]
    volumes:
      - ./:/workspace:ro

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  postgres-data:
  redis-data:
  objects-data:
  minio-data:
  clamav-data:
  qdrant-data:
  ollama-data:
