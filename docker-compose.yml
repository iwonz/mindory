  MINDORY_MODEL_RUNTIME_FACE_RECOGNITION_MODEL: ${MINDORY_MODEL_RUNTIME_FACE_RECOGNITION_MODEL:-buffalo_l}
  MINDORY_MODEL_RUNTIME_FACE_RECOGNITION_REQUIRED: ${MINDORY_MODEL_RUNTIME_FACE_RECOGNITION_REQUIRED:-false}
  MINDORY_MODEL_RUNTIME_OPENAI_COMPATIBLE_BASE_URL: ${MINDORY_MODEL_RUNTIME_OPENAI_COMPATIBLE_BASE_URL:-}
  MINDORY_MODEL_RUNTIME_OPENAI_COMPATIBLE_AUTH_MODE: ${MINDORY_MODEL_RUNTIME_OPENAI_COMPATIBLE_AUTH_MODE:-none}
  MINDORY_MODEL_RUNTIME_OPENAI_COMPATIBLE_API_KEY: ${MINDORY_MODEL_RUNTIME_OPENAI_COMPATIBLE_API_KEY:-}
  MINDORY_MODEL_RUNTIME_OPENAI_OAUTH_ACCESS_TOKEN: ${MINDORY_MODEL_RUNTIME_OPENAI_OAUTH_ACCESS_TOKEN:-}
  MINDORY_MODEL_RUNTIME_OLLAMA_BASE_URL: ${MINDORY_MODEL_RUNTIME_OLLAMA_BASE_URL:-http://ollama:11434}
  MINDORY_MODEL_RUNTIME_LOCAL_BASE_URL: ${MINDORY_MODEL_RUNTIME_LOCAL_BASE_URL:-http://model-runtime:8080}
  MINDORY_MCP_ENABLED: ${MINDORY_MCP_ENABLED:-true}
  MINDORY_MCP_TRANSPORT: ${MINDORY_MCP_TRANSPORT:-stdio}
