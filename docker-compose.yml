  MINDORY_CLI_API_TOKEN: ${MINDORY_CLI_API_TOKEN:-}
  MINDORY_HERMES_ADAPTER_ENABLED: ${MINDORY_HERMES_ADAPTER_ENABLED:-false}
  MINDORY_HERMES_API_URL: ${MINDORY_HERMES_API_URL:-http://api:3000}
  MINDORY_HERMES_API_TOKEN: ${MINDORY_HERMES_API_TOKEN:-}
  MINDORY_HERMES_DEFAULT_PROJECT: ${MINDORY_HERMES_DEFAULT_PROJECT:-default}
  MINDORY_HERMES_DEFAULT_USER_PEER: ${MINDORY_HERMES_DEFAULT_USER_PEER:-default-user}
  MINDORY_HERMES_DEFAULT_AGENT_PEER: ${MINDORY_HERMES_DEFAULT_AGENT_PEER:-hermes}
  MINDORY_HERMES_CONTEXT_TOKEN_BUDGET: ${MINDORY_HERMES_CONTEXT_TOKEN_BUDGET:-3000}

x-mindory-app: &mindory-app
  build:
    context: .
    dockerfile: Dockerfile
  working_dir: /app
  init: true
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: mindory
      POSTGRES_USER: mindory
      POSTGRES_PASSWORD: mindory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindory -d mindory"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

  migrate:
    <<: *mindory-app
    restart: "no"
    command: ["pnpm", "db:migrate"]
    environment:
      <<: *mindory-env
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *mindory-app
    command: ["node", "apps/api/dist/server.js"]
    environment:
      <<: *mindory-env
      NODE_ENV: production
    ports:
      - "${MINDORY_API_PORT:-3000}:${MINDORY_API_PORT:-3000}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const port=process.env.MINDORY_API_PORT||3000; fetch('http://127.0.0.1:'+port+'/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1));"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - objects-data:/data/mindory/objects

  mcp:
    <<: *mindory-app
    command: ["node", "apps/mcp/dist/stdio.js"]
    stdin_open: true
    environment:
      <<: *mindory-env
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *mindory-app
    command: ["node", "apps/worker/dist/server.js"]
    environment:
      <<: *mindory-env
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - objects-data:/data/mindory/objects

  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINDORY_S3_ACCESS_KEY_ID:-mindory}
      MINIO_ROOT_PASSWORD: ${MINDORY_S3_SECRET_ACCESS_KEY:-mindory-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  clamav:
    image: clamav/clamav:stable
    platform: ${MINDORY_CLAMAV_PLATFORM:-linux/amd64}
    profiles: ["clamav"]
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["qdrant"]
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  docling:
    image: node:24-alpine
    profiles: ["docling"]
    restart: unless-stopped
    working_dir: /workspace
    command: ["node", "scripts/docker-placeholder-service.mjs", "docling"]
    volumes:
      - ./:/workspace:ro

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  model-runtime:
    image: node:24-alpine
    profiles: ["local-models"]
    restart: unless-stopped
    command:
      [
        "node",
        "-e",
        "require('http').createServer((req,res)=>{res.setHeader('content-type','application/json');res.end(JSON.stringify({status:'ok',service:'model-runtime',placeholder:true}))}).listen(8080,'0.0.0.0')"
      ]
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  redis-data:
  objects-data:
  minio-data:
  clamav-data:
  qdrant-data:
  ollama-data:
