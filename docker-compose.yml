x-mindory-app: &mindory-app
  build:
    context: .
    dockerfile: Dockerfile
  working_dir: /app
  init: true
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    command:
      [
        "bash",
        "-lc",
        "export PATH=/usr/lib/postgresql/16/bin:$PATH && mkdir -p /var/lib/postgresql/wal-archive && chown -R postgres:postgres /var/lib/postgresql/wal-archive && if [ \"${MINDORY_POSTGRES_WAL_ARCHIVE_ENABLED:-true}\" = \"true\" ]; then exec docker-entrypoint.sh postgres -c wal_level=replica -c archive_mode=on -c archive_command='test ! -f /var/lib/postgresql/wal-archive/%f && cp %p /var/lib/postgresql/wal-archive/%f' -c archive_timeout=${MINDORY_POSTGRES_WAL_ARCHIVE_TIMEOUT_SECONDS:-60}s; else exec docker-entrypoint.sh postgres; fi"
      ]
    environment:
      POSTGRES_DB: mindory
      POSTGRES_USER: mindory
      POSTGRES_PASSWORD: mindory
      MINDORY_POSTGRES_WAL_ARCHIVE_ENABLED: ${MINDORY_POSTGRES_WAL_ARCHIVE_ENABLED:-true}
      MINDORY_POSTGRES_WAL_ARCHIVE_TIMEOUT_SECONDS: ${MINDORY_POSTGRES_WAL_ARCHIVE_TIMEOUT_SECONDS:-60}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindory -d mindory"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ${MINDORY_HOME:-${HOME}/.mindory}/data/postgres:/var/lib/postgresql/data
      - ${MINDORY_HOME:-${HOME}/.mindory}/backups/postgres-wal:/var/lib/postgresql/wal-archive

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ${MINDORY_HOME:-${HOME}/.mindory}/data/redis:/data

  migrate:
    <<: *mindory-app
    restart: "no"
    command: ["pnpm", "db:migrate"]
    environment:
      <<: *mindory-env
      NODE_ENV: production
    ports:
      - "${MINDORY_METRICS_WORKER_PORT:-3001}:${MINDORY_METRICS_WORKER_PORT:-3001}"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *mindory-app
    command: ["node", "apps/api/dist/server.js"]
    environment:
      <<: *mindory-env
      NODE_ENV: production
    ports:
      - "${MINDORY_API_PORT:-3000}:${MINDORY_API_PORT:-3000}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const port=process.env.MINDORY_API_PORT||3000; fetch('http://127.0.0.1:'+port+'/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1));"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ${MINDORY_HOME:-${HOME}/.mindory}/config:/data/mindory/config:ro
      - ${MINDORY_HOME:-${HOME}/.mindory}/data/objects:/data/mindory/objects
      - ${MINDORY_HOME:-${HOME}/.mindory}/logs:/data/mindory/logs

  mcp:
    <<: *mindory-app
    command: ["node", "apps/mcp/dist/stdio.js"]
    stdin_open: true
    environment:
      <<: *mindory-env
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ${MINDORY_HOME:-${HOME}/.mindory}/config:/data/mindory/config:ro
      - ${MINDORY_HOME:-${HOME}/.mindory}/logs:/data/mindory/logs

  worker:
    <<: *mindory-app
    command: ["node", "apps/worker/dist/server.js"]
    environment:
      <<: *mindory-env
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ${MINDORY_HOME:-${HOME}/.mindory}/config:/data/mindory/config:ro
      - ${MINDORY_HOME:-${HOME}/.mindory}/data/objects:/data/mindory/objects
      - ${MINDORY_HOME:-${HOME}/.mindory}/logs:/data/mindory/logs

  librefs:
    image: ghcr.io/librefs/librefs:latest
    profiles: ["librefs"]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINDORY_S3_ACCESS_KEY_ID:-mindory}
      MINIO_ROOT_PASSWORD: ${MINDORY_S3_SECRET_ACCESS_KEY:-mindory-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ${MINDORY_HOME:-${HOME}/.mindory}/data/librefs:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9000/minio/health/ready || wget -q --spider http://127.0.0.1:9000"]
      interval: 10s
      timeout: 5s
      retries: 10

  librefs-bucket:
    image: minio/mc:latest
    profiles: ["librefs"]
    restart: "no"
    depends_on:
      librefs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set mindory http://librefs:9000 "$${MINDORY_S3_ACCESS_KEY_ID}" "$${MINDORY_S3_SECRET_ACCESS_KEY}" &&
        mc mb --ignore-existing "mindory/$${MINDORY_S3_BUCKET}" &&
        mc ls "mindory/$${MINDORY_S3_BUCKET}"
    environment:
      MINDORY_S3_BUCKET: ${MINDORY_S3_BUCKET:-mindory}
      MINDORY_S3_ACCESS_KEY_ID: ${MINDORY_S3_ACCESS_KEY_ID:-mindory}
      MINDORY_S3_SECRET_ACCESS_KEY: ${MINDORY_S3_SECRET_ACCESS_KEY:-mindory-secret}

  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINDORY_S3_ACCESS_KEY_ID:-mindory}
      MINIO_ROOT_PASSWORD: ${MINDORY_S3_SECRET_ACCESS_KEY:-mindory-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ${MINDORY_HOME:-${HOME}/.mindory}/data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-bucket:
    image: minio/mc:latest
    profiles: ["minio"]
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set mindory http://minio:9000 "$${MINDORY_S3_ACCESS_KEY_ID}" "$${MINDORY_S3_SECRET_ACCESS_KEY}" &&
        mc mb --ignore-existing "mindory/$${MINDORY_S3_BUCKET}" &&
        mc ls "mindory/$${MINDORY_S3_BUCKET}"
    environment:
      MINDORY_S3_BUCKET: ${MINDORY_S3_BUCKET:-mindory}
      MINDORY_S3_ACCESS_KEY_ID: ${MINDORY_S3_ACCESS_KEY_ID:-mindory}
      MINDORY_S3_SECRET_ACCESS_KEY: ${MINDORY_S3_SECRET_ACCESS_KEY:-mindory-secret}

  clamav:
    image: clamav/clamav:stable
    platform: ${MINDORY_CLAMAV_PLATFORM:-linux/amd64}
    profiles: ["clamav"]
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - ${MINDORY_HOME:-${HOME}/.mindory}/data/clamav:/var/lib/clamav
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "printf 'mindory clamav compose health' >/tmp/mindory-clamav-health.txt && clamdscan --no-summary /tmp/mindory-clamav-health.txt >/dev/null 2>&1"
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["qdrant"]
    restart: unless-stopped
    ports:
      - "${MINDORY_QDRANT_HTTP_PORT:-6333}:6333"
      - "${MINDORY_QDRANT_GRPC_PORT:-6334}:6334"
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-lc",
          "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - ${MINDORY_HOME:-${HOME}/.mindory}/data/qdrant:/qdrant/storage

  docling:
    <<: *mindory-app
    profiles: ["docling"]
    restart: unless-stopped
    command: ["node", "scripts/docling-service.mjs"]
    environment:
      <<: *mindory-env
      NODE_ENV: production
    ports:
      - "${MINDORY_DOCLING_PORT:-8081}:${MINDORY_DOCLING_PORT:-8081}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const port=process.env.MINDORY_DOCLING_PORT||8081; fetch('http://127.0.0.1:'+port+'/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1));"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ${MINDORY_HOME:-${HOME}/.mindory}/logs:/data/mindory/logs

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - ${MINDORY_HOME:-${HOME}/.mindory}/data/ollama:/root/.ollama

  llm:
    <<: *mindory-app
    profiles: ["local-models"]
    restart: unless-stopped
    command: ["node", "scripts/local-model-server.mjs"]
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1));"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ${MINDORY_HOME:-${HOME}/.mindory}/logs:/data/mindory/logs
      - ${MINDORY_HOME:-${HOME}/.mindory}/data/models:/data/mindory/models
