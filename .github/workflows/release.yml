name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v, for example 0.1.0.
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          if [[ -z "$VERSION" ]]; then
            echo "Release version is required." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "url_base=https://github.com/${GITHUB_REPOSITORY}/releases/download/v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run repository checks
        run: pnpm check
        env:
          MINDORY_TEST_DOCKER_BIN: docker

      - name: Build Docker image
        id: image
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${{ steps.version.outputs.version }}"
          SHA_TAG="${GITHUB_SHA::12}"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=$VERSION" \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:$SHA_TAG" \
            .
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "version_tag=$IMAGE:$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$IMAGE:$SHA_TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker images
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          docker push "${{ steps.image.outputs.version_tag }}"
          docker push "${{ steps.image.outputs.sha_tag }}"

      - name: Generate release bundle
        run: pnpm release:bundle -- --version "${{ steps.version.outputs.version }}" --url-base "${{ steps.version.outputs.url_base }}" --require-signing-key
        env:
          MINDORY_RELEASE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.MINDORY_RELEASE_SIGNING_PRIVATE_KEY_PEM }}

      - name: Publish checksum file
        shell: bash
        run: |
          cd dist/releases
          sha256sum mindory-${{ steps.version.outputs.version }}.tar.gz mindory-${{ steps.version.outputs.version }}.manifest.env mindory-${{ steps.version.outputs.version }}.manifest.env.public.pem > mindory-${{ steps.version.outputs.version }}.sha256

      - name: Generate release notes
        run: |
          node scripts/generate-release-notes.js \
            --version "${{ steps.version.outputs.version }}" \
            --tag "${{ steps.version.outputs.tag }}" \
            --image "${{ steps.image.outputs.version_tag }}" \
            --sha-image "${{ steps.image.outputs.sha_tag }}" \
            --out "dist/releases/mindory-${{ steps.version.outputs.version }}.release-notes.md"

      - name: Smoke release install
        run: node scripts/smoke-release-install.js --manifest "dist/releases/mindory-${{ steps.version.outputs.version }}.manifest.env" --public-key "dist/releases/mindory-${{ steps.version.outputs.version }}.manifest.env.public.pem" --home "$RUNNER_TEMP/mindory-release-smoke"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mindory-release-${{ steps.version.outputs.version }}
          path: |
            dist/releases/mindory-${{ steps.version.outputs.version }}.tar.gz
            dist/releases/mindory-${{ steps.version.outputs.version }}.manifest.env
            dist/releases/mindory-${{ steps.version.outputs.version }}.manifest.env.public.pem
            dist/releases/mindory-${{ steps.version.outputs.version }}.sha256
            dist/releases/mindory-${{ steps.version.outputs.version }}.release-notes.md
          if-no-files-found: error

      - name: Publish GitHub release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          NOTES="dist/releases/mindory-${{ steps.version.outputs.version }}.release-notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft=true --title "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" --draft --title "$TAG" --notes-file "$NOTES"
          fi
          gh release upload "$TAG" dist/releases/mindory-${{ steps.version.outputs.version }}.tar.gz dist/releases/mindory-${{ steps.version.outputs.version }}.manifest.env dist/releases/mindory-${{ steps.version.outputs.version }}.manifest.env.public.pem dist/releases/mindory-${{ steps.version.outputs.version }}.sha256 "$NOTES" --clobber
